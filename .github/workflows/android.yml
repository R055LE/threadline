name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test, lint, and assemble debug and release
        run: ./gradlew --no-daemon test lint assembleDebug assembleRelease
      - name: Verify release JNI field names
        run: ./scripts/verify-release-jni-contract.sh
      - name: Package unsigned alpha candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: alpha-candidate
        shell: bash
        run: |
          THREADLINE_METADATA_REPOSITORY_DIR="${GITHUB_WORKSPACE}"
          . ./scripts/project-metadata.sh
          unset THREADLINE_METADATA_REPOSITORY_DIR
          candidate_name="threadline-${THREADLINE_VERSION_NAME}-UNSIGNED"
          candidate_dir="${RUNNER_TEMP}/${candidate_name}"
          candidate_apk="${candidate_name}.apk"
          install -d "${candidate_dir}"
          install -m 0644 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "${candidate_dir}/${candidate_apk}"
          install -m 0644 \
            app/build/outputs/mapping/release/mapping.txt \
            "${candidate_dir}/mapping.txt"
          (
            cd "${candidate_dir}"
            sha256sum "${candidate_apk}" > "${candidate_apk}.sha256"
          )
          {
            echo "artifact-kind=unsigned-alpha-candidate"
            echo "distribution-status=unsigned-not-an-official-release"
            echo "source-repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "source-commit=${GITHUB_SHA}"
            echo "application-id=${THREADLINE_RELEASE_APPLICATION_ID}"
            echo "version-name=${THREADLINE_VERSION_NAME}"
            echo "version-code=${THREADLINE_VERSION_CODE}"
            echo "apk=${candidate_apk}"
          } > "${candidate_dir}/BUILD-METADATA.txt"
          {
            echo "name=${candidate_name}-${GITHUB_SHA:0:12}"
            echo "path=${candidate_dir}"
          } >> "${GITHUB_OUTPUT}"
      - name: Upload unsigned alpha candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.alpha-candidate.outputs.name }}
          path: ${{ steps.alpha-candidate.outputs.path }}
          if-no-files-found: error
          retention-days: 7
